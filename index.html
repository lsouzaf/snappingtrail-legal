<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SnappingTrail Collect — Legal</title>
  <script>
    (function() {
      var lang = (navigator.language || navigator.userLanguage || 'pt').toLowerCase();
      var target = lang.indexOf('en') === 0 ? 'en/' : 'pt/';
      window.location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=pt/">
</head>
<body>
  <p>Redirecionando... <a href="pt/">Português</a> | <a href="en/">English</a></p>
</body>
</html>
