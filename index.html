<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnappingTrail Collect — Documentation</title>
  <style>
    :root {
      --text: #1c2333;
      --text-soft: #4a5568;
      --accent: #1a3cff;
      --border: #dde2ec;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 40px 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8f9fb 0%, #eceef3 100%);
    }
    .container {
      max-width: 560px;
      width: 100%;
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(28, 35, 51, 0.08);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .subtitle {
      color: var(--text-soft);
      font-size: 15px;
      margin: 0 0 32px;
    }
    .section {
      margin-bottom: 28px;
    }
    .section:last-child { margin-bottom: 0; }
    h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 12px;
    }
    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .links a {
      flex: 1;
      min-width: 140px;
      padding: 12px 16px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      transition: border-color 0.15s, transform 0.15s;
      text-align: center;
    }
    .links a:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-soft);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SnappingTrail Collect</h1>
    <p class="subtitle">Documentation / Documentação</p>

    <div class="section">
      <h2>User Manual / Manual do Usuário</h2>
      <div class="links">
        <a href="en/manual/">English</a>
        <a href="pt/manual/">Português</a>
      </div>
    </div>

    <div class="section">
      <h2>Privacy Policy / Política de Privacidade</h2>
      <div class="links">
        <a href="en/">English</a>
        <a href="pt/">Português</a>
      </div>
    </div>

    <footer>
      SnappingTrail Collect · Navaho Consultoria
    </footer>
  </div>
</body>
</html>
