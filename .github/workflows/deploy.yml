# Builds docs.snappingtrail.com with Docusaurus, checks that the old addresses still answer, and
# deploys to GitHub Pages (Settings → Pages → Source: "GitHub Actions"). Pull requests only build
# and check; a push to main also deploys, then checks the live site.
name: Docs site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the addresses (/, /en/, /pt/, /en/manual/ → /manual/, /pt/manual/)
        run: npm run check-urls
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # the checkout of scripts/check-live.sh
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # The deploy can succeed and still leave a broken site (a missing stylesheet answers 404 while
      # the page answers 200): the live /manual/ and its CSS must answer 200, or the job fails.
      - uses: actions/checkout@v4
      - name: Check the live site (/manual/ and its stylesheet answer 200)
        run: scripts/check-live.sh https://docs.snappingtrail.com
